<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping list example</title>
    <style>
      li {
        margin-bottom: 10px;
      }

      li button {
        font-size: 12px;
        margin-left: 20px;
        color: #666;
      }
    </style>
  </head>
  <body>

    <h1>My shopping list</h1>

    <form>
      <label for="item">Enter a new item:</label>
      <input type="text" name="item" id="item">
      <button>Add item</button>
    </form>

    <ul>

    </ul>

    <script>
      //variables initalized for ul, input, and addBtn.

      const unOrdered = document.querySelector("ul");
      const inputVal = document.querySelector("#item");
      const addBtn = document.querySelector("form button");

    addBtn.addEventListener("click", (event) => {
    event.preventDefault();

    let inputValue = inputVal.value;
    inputVal.value = "";

    const listItem = document.createElement("li");
    const span = document.createElement("span");
    const delBtn = document.createElement("button");

    listItem.appendChild(span);
    listItem.appendChild(delBtn);
    span.textContent = inputValue;
    delBtn.textContent = "delete";
    unOrdered.appendChild(listItem);

    delBtn.addEventListener("click", () => {
        unOrdered.removeChild(listItem);
    });
});

inputVal.focus();
    </script>
  </body>
</html>
