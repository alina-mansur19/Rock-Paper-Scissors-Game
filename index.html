<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bonbon&family=Caprasimo&family=Capriola&family=Gorditas:wght@400;700&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
  </head>
  <body>
    <div id="header">
      <p id="title">Rock, Paper, Scissors</p>
    </div>

    <div id="instruction">
        Pick Your Object:
    </div>

    <div id="objects">
      <div id="choice">Rock</div>
      <div id="choice">Paper</div>
      <div id="choice">Scissors</div>
    </div>
    
    <div id="result">
      <div id="id">You</div>
      <div id="id">Computer</div>
    </div>

    <div id="score">
      <div>0</div>
      <div>0</div>
    </div>

  </body>
 
</html>
